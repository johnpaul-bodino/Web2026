<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk</title>
    <link rel="stylesheet" href="css/bodinoStyle.css">
    <link rel="stylesheet" href="css/bodinoAdmin.css">

</head>
<body>
    <div class="top-box">
        <div class="header-left">
            <h1>BODINO KIOSK</h1>
            <h2>By: John Paul P. Bodino</h2>

        </div>
        <div class="header-right">
            <button type="submit" name="bodinoViewClient" class="bodinoViewClient"> View Customer </button>
            <button type='submit' name="bodinoViewProduct" class="bodinoViewProduct"> View Products </button>
            
            <button type='submit' name="bodinoLogout" class="bodinoLogout"> Logout </button>
        </div>
    </div>
    <div class="middle-box">
        <table class="editTable">
            <tr>
                <td> <label for="bodino_ProductName"> Product Name </label>  </td>
                <td> <input type="text" id="bodino_ProductName" name ="bodino_ProductName" required value= ""></td>
            </tr>

            <tr>
                <td> <label for="bodino_Unit"> Unit </label>  </td>
                <td> <input type="text" id="bodino_Unit" name ="bodino_Unit" required value= ""></td>
            </tr>
            <tr>
                <td> <label for="bodino_PriceUnit"> Price per Unit </label>  </td>
                <td> <input type="number" id="bodino_PriceUnit" name ="bodino_PriceUnit" required value= ""></td>
            </tr>
            <tr>
                <td> <label for="bodino_ImageUrl"> Image URL </label>  </td>
                <td><input type="file" id="bodino_ImageUrl" name ="bodino_ImageUrl"  accept="image/*"></td>
            </tr>
            <tr>
                <td>
                    <button type='submit' name="bodinoUpdate" class="bodinoUpdate"> Update </button>
                </td>
                <td>
                    <button type='submit' name="bodinoCancel" class="bodinoCancel"> Cancel </button>
                </td>
            </tr>

        </table>
    </div>
    <div class="bottom-box">
        <h2>www.johnpaulbodino.com</h2>
    </div>
</body>
</html>
